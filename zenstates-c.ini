; zenstates-c.ini -- config for zenstates-c.exe (Ryzen boost cap, 0.2.0)
; Place this file next to zenstates-c.exe. The GUI (zenstates-c-gui.exe)
; edits this same file. Missing file or missing key -> defaults are used
; and a warning is written to the log; the program never crashes on config.
;
; All frequencies are caps, NOT fixed frequencies: below the cap Boost
; still scales dynamically and idle still downclocks / drops voltage.

[Boost]
; Single-core boost cap, MHz. The stock max is read from the CPU at startup
; (0x6E); values above it are clamped to it. Typo guard range: 3000-6000.
; Example for a Ryzen 5 3600 (stock max 4200): 4000.
SingleCoreMaxMHz=4000
; All-core boost cap, MHz. Same ceiling. Clamped to <= single-core.
; Example for a Ryzen 5 3600: 3900.
AllCoreMaxMHz=3900

[Power]
; OPTIONAL (0.2.0): these keys are only applied when present. With no keys
; here the power limits are left exactly as the BIOS set them -- this is the
; recommended default on any CPU other than a Ryzen 5 3600, whose stock
; limits (PBO off) are PPT 88 W / TDC 60 A / EDC 90 A. If you want to pin
; them, uncomment and set them to YOUR CPU's stock values (check HWMonitor
; or your BIOS). Ranges allowed: PPT 45-300 W, TDC 30-200 A, EDC 45-300 A.
; Values outside the range are clamped, not rejected.
;PPT_W=88
;TDC_A=60
;EDC_A=90

[Startup]
; 1 = the scheduled task installed by install-autostart.bat applies this
; config at boot. 0 = do not install the task (manual runs only).
; This value is read by the GUI / installer; zenstates-c.exe itself always
; applies the config when it is run, whatever this says.
AutoApply=1

[Logging]
; Absolute path, or leave empty for <exe dir>\zenstates-c.log.
; The scheduled task runs as SYSTEM, so do NOT put the log under a user
; profile folder (SYSTEM cannot write there).
LogPath=
