; zenstates-c.ini -- config for zenstates-c.exe (Ryzen boost cap, 0.2.2)
; Place this file next to zenstates-c.exe. The GUI (zenstates-c-gui.exe)
; edits this same file. Missing file or missing key -> defaults are used
; and a warning is written to the log; the program never crashes on config.
;
; All frequencies are caps, NOT fixed frequencies: below the cap Boost
; still scales dynamically and idle still downclocks / drops voltage.
;
; 0.2.1: the cap is set over HSMP (socket-wide, message 0x9). HSMP has a
; SINGLE socket cap, so the two values below collapse to ONE effective
; cap: min(SingleCoreMaxMHz, AllCoreMaxMHz). If you want a single 4000
; MHz cap, set both to 4000 (or AllCoreMaxMHz=4000 with SingleCoreMaxMHz
; at 4000 or above). The old RSMU 0x29/0x2B route is dead (rejected by
; current SMU firmware); see README / SLOW_MODE.md.
;
; 0.2.2: `zenstates-c.exe --read` reads the current config from the CPU
; and writes it here (Boost keys = the current HSMP socket cap; Power keys
; left EMPTY, because the applied PPT/TDC/EDC cannot be read back). The GUI
; has a "Read current from CPU" button for the same thing, and shows Power
; fields EMPTY when unset (an empty value means "left as the BIOS set it").

[Boost]
; Single-core boost cap, MHz. The stock max is read from the CPU at startup
; (0x6E, fused max); values above it are clamped to it. Typo guard range: 3000-6000.
; Example for a Ryzen 5 3600 (stock max 4200): 4000.
SingleCoreMaxMHz=4000
; All-core boost cap, MHz. Same ceiling. Clamped to <= single-core.
; The effective HSMP socket cap is min(single, all), so with the defaults
; above the cap is 3900 MHz. Example for a Ryzen 5 3600: 3900.
AllCoreMaxMHz=3900

[Power]
; OPTIONAL (0.2.0): these keys are only applied when present AND non-empty.
; An EMPTY value (or a missing key) means "unset" -- the power limits are
; left exactly as the BIOS set them. This is the recommended default on any
; CPU other than a Ryzen 5 3600, whose stock limits (PBO off) are PPT 88 W /
; TDC 60 A / EDC 90 A. The entries below are present but EMPTY, so the GUI
; shows them (as empty fields) instead of hiding them, and --read leaves
; them empty because the applied values cannot be read back. If you want to
; pin them, fill in YOUR CPU's stock values (check HWMonitor or your BIOS).
; Ranges allowed: PPT 45-300 W, TDC 30-200 A, EDC 45-300 A.
; Values outside the range are clamped, not rejected.
PPT_W=
TDC_A=
EDC_A=

[Startup]
; 1 = the scheduled task installed by install-autostart.bat applies this
; config at boot. 0 = do not install the task (manual runs only).
; This value is read by the GUI / installer; zenstates-c.exe itself always
; applies the config when it is run, whatever this says.
AutoApply=1

[Logging]
; Absolute path, or leave empty for <exe dir>\zenstates-c.log.
; The scheduled task runs as SYSTEM, so do NOT put the log under a user
; profile folder (SYSTEM cannot write there).
LogPath=
