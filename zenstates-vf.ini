; zenstates-vf.ini -- config for zenstates-vf.exe (V/F sweep, Ryzen 5 3600)
; Edit with Notepad. Missing file / missing key -> built-in defaults.
; All frequencies are in MHz. The sweep sets the Boost cap to each target
; (same 0x29/0x2B messages as zenstates-c) and reads the VID at that cap.

[Sweep]
; Sweep direction follows Start -> End: 4200 -> 3600 steps down by default.
StartMHz=4200
EndMHz=3600
StepMHz=100
; Wait after each cap change before sampling (SMU + boost need to settle).
SettleMs=1500
; Samples per target; the median is the V/F point for that target.
Samples=5
SampleIntervalMs=200
; Logical core the spin-load runs on (0-11 on a 3600). The reader measures
; its SMT sibling (LoadCore^1), same physical core. 0 = first core.
LoadCore=0

[Output]
; CSV with one row per sample. Empty = zenstates-vf.csv next to the exe.
CsvPath=

[Logging]
; Empty = zenstates-vf.log next to the exe.
LogPath=
