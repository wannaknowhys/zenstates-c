; zenstates-vf.ini -- config for zenstates-vf.exe (V/F sweep, Ryzen Zen 2 / Zen 3 / Zen 4, 0.2.2)
; Edit with Notepad. Missing file / missing key -> built-in defaults.
; All frequencies are in MHz. The sweep sets the Boost cap (HSMP socket
; cap, message 0x9 -- same cap as zenstates-c) to each target and reads
; the VID at that cap. `zenstates-vf.exe --hold [core]` holds a load on one
; core until Ctrl+C instead of sweeping (uses LoadCore when no core given).

[Sweep]
; Sweep direction follows Start -> End: Fmax -> Fmax-600 steps down by default.
; StartMHz 0 (or absent) = start at the stock max read from the CPU (0x6E).
; EndMHz 0 (or absent) = end at Fmax - 600 MHz. Set an explicit value to pin the floor.
StartMHz=0
EndMHz=0
StepMHz=100
; Wait after each cap change before sampling (SMU + boost need to settle).
SettleMs=1500
; Samples per target; the median is the V/F point for that target.
Samples=5
SampleIntervalMs=200
; Logical core the spin-load runs on (0 to logical cores - 1). The reader
; measures the true SMT sibling (found via APIC ID, not assumed LoadCore^1);
; if none exists (SMT off) it reads the load core itself. 0 = first core.
LoadCore=0

[Output]
; CSV with one row per sample. Empty = zenstates-vf.csv next to the exe.
CsvPath=

[Logging]
; Empty = zenstates-vf.log next to the exe.
LogPath=
